<text x="120" y="500" font-size="12.8" fill="#9aa7b4" text-anchor="start" font-weight="400">贡献三处摆放 · 图表分层 · 边界自限</text>
<path d="M92,536 L92,541" stroke="#30363d" stroke-width="1.6" fill="none" marker-end="url(#arw)"/>
<rect x="56" y="542" width="580" height="92" rx="11" fill="#161b22" stroke="#58a6ff" stroke-width="1.4"/>
