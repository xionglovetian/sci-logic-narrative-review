<text x="720" y="321" font-size="12.5" fill="#7ee787" text-anchor="start" font-weight="700" class="mk">P-A</text>
<text x="764" y="321" font-size="12.5" fill="#e6edf3" text-anchor="start" font-weight="600">方法创新型</text>
<text x="842" y="321.5" font-size="11.4" fill="#9aa7b4" text-anchor="start" font-weight="400">等容量对照明显弱 → 大修后接收</text>
<rect x="708" y="341" width="398" height="30" rx="8" fill="#1c2330" stroke="#58a6ff" stroke-width="1.2"/>
<text x="720" y="356" font-size="12.5" fill="#58a6ff" text-anchor="start" font-weight="700" class="mk">P-B</text>
<text x="764" y="356" font-size="12.5" fill="#e6edf3" text-anchor="start" font-weight="600">评估认知型</text>
<text x="842" y="356.5" font-size="11.4" fill="#9aa7b4" text-anchor="start" font-weight="400">对照缺失/微弱但缺口真 → 中修可接受</text>
<rect x="708" y="376" width="398" height="30" rx="8" fill="#1c2330" stroke="#ff7b72" stroke-width="1.2"/>
<text x="720" y="391" font-size="12.5" fill="#ff7b72" text-anchor="start" font-weight="700" class="mk">P-C</text>
<text x="764" y="391" font-size="12.5" fill="#e6edf3" text-anchor="start" font-weight="600">证据不足</text>
<text x="842" y="391.5" font-size="11.4" fill="#9aa7b4" text-anchor="start" font-weight="400">无对照却称因果 / 数字不可溯源 → 拒稿</text>
<path d="M907.0,416 L907.0,440" stroke="#ff7b72" stroke-width="1.6" fill="none" marker-end="url(#arw)"/>
<rect x="690" y="444" width="434" height="156" rx="14" fill="#10161f" stroke="#7ee787" stroke-width="1.6"/>
<text x="708" y="468" font-size="13.5" fill="#7ee787" text-anchor="start" font-weight="700">报告交付（每轮一份 · 强制）</text>
<text x="716" y="492" font-size="12.2" fill="#c9d4e0" text-anchor="start" font-weight="400">▪ 判决摘要 + 致命项清单</text>
<text x="716" y="511" font-size="12.2" fill="#c9d4e0" text-anchor="start" font-weight="400">▪ 评分表（A–F 合计 − G 扣分）</text>
<text x="716" y="530" font-size="12.2" fill="#c9d4e0" text-anchor="start" font-weight="400">▪ 漏洞卡片 V-xx（八字段 · 带定位）</text>
<text x="716" y="549" font-size="12.2" fill="#c9d4e0" text-anchor="start" font-weight="400">▪ 数字核验表（≥8 行）</text>
<text x="716" y="568" font-size="12.2" fill="#c9d4e0" text-anchor="start" font-weight="400">▪ 声称强度越级清单</text>
<text x="716" y="587" font-size="12.2" fill="#c9d4e0" text-anchor="start" font-weight="400">▪ 处方 + 复审判据 + 下一步顺序</text>
