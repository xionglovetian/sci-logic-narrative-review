<text x="120" y="696" font-size="12.8" fill="#9aa7b4" text-anchor="start" font-weight="400">七维加权 + 六类致命项硬阈值 → P-A/P-B/P-C</text>
<rect x="546" y="652" width="60" height="20" rx="10.0" fill="none" stroke="#ff7b72" stroke-width="1.2" opacity="0.85"/><text x="576.0" y="662.5" font-size="11" fill="#ff7b72" text-anchor="middle" font-weight="400">先查阈值</text>
<path d="M92,732 L92,737" stroke="#30363d" stroke-width="1.6" fill="none" marker-end="url(#arw)"/>
<rect x="56" y="738" width="580" height="92" rx="11" fill="#161b22" stroke="#7ee787" stroke-width="1.4"/>
