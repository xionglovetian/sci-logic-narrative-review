<rect width="1160" height="986" rx="14" fill="#0d1117"/>
<text x="36" y="46" font-size="23" fill="#e6edf3" text-anchor="start" font-weight="700">SCI逻辑叙事审查 · 工作流程架构</text>
<text x="36" y="74" font-size="13.5" fill="#9aa7b4" text-anchor="start" font-weight="400">从收料 → 分级 → 七步审查 → 三路径判定 → 报告交付 → 自检回环</text>
