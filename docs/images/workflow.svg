<path d="M92,634 L92,639" stroke="#30363d" stroke-width="1.6" fill="none" marker-end="url(#arw)"/>
<rect x="56" y="640" width="580" height="92" rx="11" fill="#161b22" stroke="#ff7b72" stroke-width="1.4"/>
