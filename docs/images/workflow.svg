<text x="120" y="180" font-size="15.5" fill="#e6edf3" text-anchor="start" font-weight="600">输入盘点与缺口分级</text>
<text x="120" y="206" font-size="12.8" fill="#9aa7b4" text-anchor="start" font-weight="400">稿件 · 图表 · 台账 · 期刊 → 判定 G0 / G1 / G2</text>
<rect x="546" y="162" width="60" height="20" rx="10.0" fill="none" stroke="#58a6ff" stroke-width="1.2" opacity="0.85"/><text x="576.0" y="172.5" font-size="11" fill="#58a6ff" text-anchor="middle" font-weight="400">定位索引</text>
