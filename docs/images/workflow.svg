<rect x="56" y="248" width="580" height="92" rx="11" fill="#161b22" stroke="#7ee787" stroke-width="1.4"/>
<rect x="56" y="248" width="5" height="92" rx="2.5" fill="#7ee787"/>
<circle cx="92" cy="294.0" r="15" fill="#1c2330" stroke="#7ee787" stroke-width="1.4"/>
