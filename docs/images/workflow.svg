<text x="120" y="278" font-size="15.5" fill="#e6edf3" text-anchor="start" font-weight="600">L1–L2 故事链前置</text>
<text x="120" y="304" font-size="12.8" fill="#9aa7b4" text-anchor="start" font-weight="400">缺口是否成立 → 方案是否逐条对症</text>
